# Builds the site and publishes it to GitHub Pages whenever main changes.
# One-time setup: repo Settings > Pages > Source: "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Content data is already committed, so the build doesn't fetch sources.
      # The site is served from bible.tomggonzalez.com (root), so no BASE_PATH.
      # The build fetches Google Fonts, which sometimes fails once; try up to 3 times.
      - run: |
          for attempt in 1 2 3; do
            npm run build && exit 0
            echo "Build failed (attempt $attempt of 3)"
            sleep 20
          done
          exit 1
      - run: touch out/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
